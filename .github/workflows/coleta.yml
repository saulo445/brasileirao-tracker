name: Coleta diária do Brasileirão

on:
  schedule:
    - cron: "7 9 * * *"   # todo dia às 06:07 (horário de Brasília)
  workflow_dispatch:       # permite rodar manualmente pela aba Actions

permissions:
  contents: write          # necessário para o workflow fazer commit dos CSVs

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar dados e simular o campeonato
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python src/coletar.py

      - name: Salvar os CSVs no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Coleta automática de $(TZ=America/Sao_Paulo date +%F)"
          git push
